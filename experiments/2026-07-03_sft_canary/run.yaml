# 自 SFT canary 实验 v1 配置（溯源；脚本本身 CLI/常量驱动，此文件不被读取）
#
# 对应 plan: 自 SFT canary 实验（单轴重复次数扫描 + 饱和点）
# 缘起：mentor review canary 协作请求 → 需先自证方法有效才能说服训练团队常态化埋点

experiment: 2026-07-03_sft_canary
goal: 召回率–注入重复次数曲线 + 饱和点 + clean/base FPR=0 实证 + 构造已知污染 ckpt

canary:
  n: 100
  seed: 42
  path: data/canary/canary_v1.jsonl        # 明文，不进 git（.gitignore data/）
  format: "唯一 (instruction, output)；output=4随机词+4位数字，高熵保证 FPR≈0"

# 自变量：注入重复次数（dataset-level repeat），单轴
buckets:
  - {bucket: B1, rep: 1,   n: 20, effective_exposure: 3}    # rep × 3 epoch
  - {bucket: B2, rep: 3,   n: 20, effective_exposure: 9}
  - {bucket: B3, rep: 10,  n: 20, effective_exposure: 30}
  - {bucket: B4, rep: 30,  n: 20, effective_exposure: 90}
  - {bucket: B5, rep: 100, n: 20, effective_exposure: 300}
injected_lines: 2880    # 20×(1+3+10+30+100)

# 训练（LlamaFactory，chennuoxi 自有仓库）
training:
  base: /mnt/public/model/Qwen/Qwen3-1.7B-Base
  recipe: examples/contam_sft_gt/canary_v1.yaml   # 复制 clean.yaml + dataset 加 contam_canary_v1
  dataset: contam_alpaca_en_5k,contam_canary_v1
  epochs: 3
  finetuning: lora (r16, alpha32, lr5e-5)
  output: saves/contam/canary_v1 → merge → saves/contam/canary_v1_merged
  launch: bash examples/contam_sft_gt/submit_qwen3_1.7b.sh canary_v1

# 对照
controls:
  clean:  saves/contam/clean_merged   # 从没见过 canary → recall 必须 0（FPR 证据）
  base:   Qwen3-1.7B-Base             # 同上

# recall 测量
recall:
  runner: run_recall.py --ckpt canary_v1,clean,base
  hit: "contains（output 出现在解码结果）为主指标；exact（前缀）为副"
  success: "clean+base recall=0/100；canary ckpt 随 rep 单调爬升 + 可辨识饱和点"
