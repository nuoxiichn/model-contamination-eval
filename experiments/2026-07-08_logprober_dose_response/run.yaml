# LogProber 剂量-响应实验（搭 Min-K%++ dose 设定）
#
# 问题：LogProber（arXiv:2408.14352）的曲线水平度 B 能否随逐字注入的剂量 p 单调上升？
# 这是 LogProber 的本命场景——注入逐字「Question:...\nAnswer:...」文本，模型记住确切措辞，
# 水平度 tell 应响。2026-07-08 WikiMIA 实验显示 B 在弥散 membership 上不判别（AUROC≈0.5），
# 但那不是它的靶子；本实验补上逐字记忆场景的决定性对照。
#
# 设定完全复用 minkpp dose-response：每个 (dose, seed) 从干净 base 重训 Pythia-2.8b，
# 每个 batch slot 以概率 p 取 benchmark 文本、否则取 Pile-seen filler。p=0 纯 filler 控制。
# 唯一改动：checkpoint eval 时同一次前向同时算 minkpp 与 logprober_B 两个 per-sample 信号，
# 各出 summary_stats（mean/top5%/max，higher=更像被记忆）。minkpp 一路作 sanity 锚点。
#
# 计算量：贵的是 finetune（每 dose×seed 重训一份 2.8b，不存权重故必须重跑）；
# LogProber 搭同一次前向，边际≈0。gsm8k 5 dose × 1 seed ≈ 5 runs ≈ 1.5~2h（dev C500）。
# 扩到全 target/seed：把 targets / seeds 补齐即可。
#
# 跑法：
#   HF_ENDPOINT=https://hf-mirror.com HF_HOME=/mnt/public/code/chennuoxi/hf_cache \
#   PYTHONPATH=src python3 experiments/2026-07-08_logprober_dose_response/run_dose_lp.py

model:
  name: pythia-2.8b
  path: /mnt/public/code/chennuoxi/hf_cache/models/C2_pythia-2.8b
  stage_tag: base
  dtype: bfloat16

train:
  lr: 3.0e-5
  total_batches: 60
  batch_size: 8
  max_len: 256
  eval_batches: [0, 5, 10, 20, 40, 60]   # 0 = base（训练前）
  gradient_checkpointing: true

doses: [0.0, 0.01, 0.05, 0.10, 0.20]
seeds: [42]

filler:
  pile_set_name: Wikipedia (en)
  chunk_chars: 600
  n_chunks: 2000

eval:
  k_ratio: 0.2          # minkpp bottom-K%
  n_eval: 300
  min_tokens_fit: 4     # logprober 指数拟合最少 token，低于则该样本 B=NaN

targets:
  - loader: gsm8k
    seeds: [42]
  # 扩展示例（取消注释即跑，成本按 run 数线性叠加）：
  # - loader: math-500
  #   seeds: [42]
  # - loader: mmlu-pro
  #   seeds: [42]

# 预期：logprober_B 的 mean/top5%/max 随 p 单调升、p=0 停在 base、Spearman rho(dose,B)>0。
# 与 minkpp 同口径。若打平/更好 → 本命场景有价值，考虑实装 + paraphrase 对照；
# 若仍平 → 决定性证伪，保留 NotImplementedError。
