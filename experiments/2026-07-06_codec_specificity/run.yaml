# CoDeC specificity / false-positive 实验
# 证明 CoDeC 不会对「未训练数据」频繁误报，量化三类假阳风险。

model:
  name: pythia-2.8b
  path: /mnt/public/code/chennuoxi/hf_cache/models/C2_pythia-2.8b
  stage_tag: base
  dtype: bfloat16

codec:
  n_context: 1
  n_seeds: 5
  skip_first_tokens: 10
  n_eval: 300

# 2a 阴性对照面板：确证未训练（Pythia cutoff 前不含 / 后发布）的数据集。
# 各测 CoDeC → 干净数据的 null 分布，喂 calibration。keep_deltas 做 bootstrap CI。
# 仅用已注册 normalizer 的可加载集（gsm-plus/humaneval/simpleqa 无 normalizer，
# mmlu-cf split 名不兼容，均剔除）。math×3 + knowledge + code 覆盖多模态。
negative_panel:
  - gsm8k          # math word problem
  - math-500       # math
  - math           # math (hendrycks algebra 子集)
  - mmlu-pro       # knowledge MC
  - gsm1k          # GSM8k 重制干净集（本地 jsonl，真未训练 → 关键干净点）
  - evalplus       # code

# 2b 溢出/迁移：在 gsm8k 上高剂量注入后，测 CoDeC on 未训练同族 + 无关。
# 确认分数上升局域在 gsm8k，没涂抹到邻居（论文 Fig7）。
spillover:
  train_target: gsm8k
  train:
    lr: 3.0e-5
    n_batches: 40          # 高剂量：纯 gsm8k 文本，足够让 gsm8k CoDeC 饱和
    batch_size: 8
    max_len: 256
    gradient_checkpointing: true
    seed: 42
  eval_on:                 # 训练后在这些数据集上测 CoDeC
    - gsm8k                # 训练目标（应高）
    - gsm1k                # 同族未训练（应低 → 无溢出）★关键探针
    - math-500             # 数学相邻未训练
    - mmlu-pro             # 无关未训练
    - evalplus             # 无关未训练（code）

# 2c 结构性假阳：多来源混合的异质拼盘（论文已知会被人为抬到 ~50%）。
# 量化「干净但杂」的数据能冲多高 → suspect 阈值必须设在其之上。
heterogeneous:
  sources: [gsm8k, mmlu-pro, evalplus, math-500]
  per_source: 80           # 每源取 80 条混采成一个异质「数据集」
