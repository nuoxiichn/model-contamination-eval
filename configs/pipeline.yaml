# Pipeline 默认参数（命令行 / 实验 yaml 可 override）

# 缓存目录（logprobs 与 generate 结果都进这里，重跑差分时不重算）
cache_dir: ./logprobs_cache

# 实验输出根目录
outputs_dir: ./outputs

# 每个 benchmark 最多评估多少样本（None = 全量）
max_samples_per_benchmark: 1000

# ============ 各方法默认参数 ============

paraphrase:
  n_paraphrases: 5
  paraphraser: gpt-4-mini    # 或本地小模型；空字符串走规则改写
  worst_case_drop_threshold: 0.15

mink_plus_plus:
  k_ratio: 0.2          # 取概率最低的 20% token

spv_mia:
  reference_model: ${ENV:BASE_CHECKPOINT}
  n_neighbors: 10
  noise_scale: 0.1

# ============ 综合裁决规则 ============

verdict:
  red_min_strong_signals: 2     # 强信号 ≥ 2 → 红灯
  yellow_min_signals: 1
  strong_signals: [paraphrase, spv_mia]
  weak_signals: [mink_plus_plus, perm_option]

# ============ Stage 默认方法集 ============

stages:
  base:
    methods: [mink_plus_plus, perm_option]
  sft:
    methods: [spv_mia, paraphrase]
  rlhf:
    methods: [self_critique, paraphrase]
