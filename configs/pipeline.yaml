# 可直接用于 mcd run 的 base checkpoint 默认模板。
schema_version: "1.0"
run:
  id: "base-default"
  seed: 42
  output_dir: "./outputs/runs/base-default"
  fail_fast: false
model:
  backend: hf_local
  path: "${MODEL_CHECKPOINT}"
  stage: base
  dtype: bfloat16
  device_map: auto
  trust_remote_code: false
benchmarks:
  - name: gsm8k
    split: test
    max_samples: 200
    selection: random
methods:
  - name: codec
    params:
      n_context: 1
      n_seeds: 5
      skip_first_tokens: 10
      min_samples: 100
  - name: mink_plus_plus
    params:
      k_ratio: 0.2
      min_samples: 30
      estimator: trim_mean
      trim_ratio: 0.1
