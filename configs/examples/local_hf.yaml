# 本地 HF checkpoint 的最小运行契约。
# 当前仓库尚未接通统一 runner；实验脚本可读取并扩展此文件。
schema_version: "1.0"
run:
  id: "local-smoke"
  seed: 42
  output_dir: "./outputs/runs/local-smoke"
model:
  backend: hf_local
  path: "${MODEL_CHECKPOINT}"
  stage: base
  dtype: bfloat16
  device_map: auto
  trust_remote_code: false
benchmarks:
  - name: gsm8k
    split: test
    max_samples: 50
methods:
  - name: codec
    params:
      n_context: 1
      n_seeds: 2
      skip_first_tokens: 10
  - name: mink_plus_plus
    params:
      k_ratio: 0.2
