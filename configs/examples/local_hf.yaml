# 本地 Transformers/Hugging Face 格式 checkpoint 的最小运行配置。
# 模型只需在本机可由 from_pretrained 读取，无需上传到 Hub。
schema_version: "1.0"
run:
  id: "local-smoke"
  seed: 42
  output_dir: "./outputs/runs/local-smoke"
  fail_fast: false
model:
  backend: hf_local
  path: "${MODEL_CHECKPOINT}"
  stage: base
  dtype: bfloat16
  device_map: auto
  trust_remote_code: false
benchmarks:
  - name: gsm8k
    split: test
    max_samples: 50
    selection: random
methods:
  - name: codec
    params:
      n_context: 1
      n_seeds: 2
      skip_first_tokens: 10
  - name: mink_plus_plus
    params:
      k_ratio: 0.2
